name: Update IPA source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - source-config.json
      - scripts/**
      - tests/**
      - .github/workflows/update-source.yml

permissions:
  contents: write

concurrency:
  group: update-ipa-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Read release IPAs and refresh sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_source.py
      - name: Commit changed metadata and sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json altstore.json sources catalog.json CATALOG.md .metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update IPA source from published releases'
            git push
          fi
